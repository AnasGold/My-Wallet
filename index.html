<!-- FIREBASE + JAVASCRIPT -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signOut,
    sendPasswordResetEmail,
    onAuthStateChanged,
    updateProfile,
    deleteUser
}
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    setDoc,
    getDoc,
    deleteDoc
}
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey: "AIzaSyDZNuDC7hPOI6RNCfjcP-nfMN12knaSX0M",

    authDomain: "my-wallet-49a52.firebaseapp.com",

    projectId: "my-wallet-49a52",

    storageBucket: "my-wallet-49a52.firebasestorage.app",

    messagingSenderId: "765205856247",

    appId: "1:765205856247:web:4dee2b3f97abb3475bb8f2"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


let currentUserUid = null;

let categories = [
    "خواردن و خواردنەوە",
    "گواستنەوە",
    "کەلوپەل",
    "هیتر"
];

let selectedCategory = categories[0];

let monthlyBudgetVal = 0;

let expensesArray = [];

let trashArray = [];


/* SHOW BOX */

window.showBox = function(id) {

    document
    .querySelectorAll(".auth-box")
    .forEach(box => box.classList.remove("active"));

    document
    .getElementById(id)
    .classList.add("active");

};


/* REGISTER */

window.registerUser = async function() {

    const email =
    document.getElementById("reg-email").value.trim();

    const pass =
    document.getElementById("reg-password").value;

    const confirm =
    document.getElementById("reg-password-confirm").value;


    if(!email || !pass) {

        alert("تکایە هەموو خانەکان پڕبکەرەوە");

        return;

    }


    if(pass !== confirm) {

        alert("پاسۆردەکان یەکناگرنەوە");

        return;

    }


    try {

        const result =
        await createUserWithEmailAndPassword(
            auth,
            email,
            pass
        );


        const name =
        email.split("@")[0];


        await updateProfile(
            result.user,
            {
                displayName:name
            }
        );


        await saveUserData();


    }
    catch(error) {

        alert(error.message);

    }

};


/* LOGIN */

window.loginUser = async function() {

    const email =
    document.getElementById("login-email").value;

    const password =
    document.getElementById("login-password").value;


    try {

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

    }
    catch(error) {

        alert(error.message);

    }

};


/* LOGOUT */

window.logoutUser = async function() {

    await signOut(auth);

};


/* SWITCH ACCOUNT */

window.switchAccount = async function() {

    await signOut(auth);

};


/* RESET PASSWORD */

window.sendResetEmail = async function() {

    const email =
    document.getElementById("forgot-email").value;


    if(!email) {

        alert("ئیمەیڵ بنووسە");

        return;

    }


    try {

        await sendPasswordResetEmail(
            auth,
            email
        );

        alert("لینکی گۆڕینەوەی پاسۆرد نێردرا");

        showBox("login-box");

    }
    catch(error) {

        alert(error.message);

    }

};


/* SAVE DATA */

async function saveUserData() {

    if(!currentUserUid) return;


    try {

        await setDoc(

            doc(
                db,
                "users",
                currentUserUid
            ),

            {

                categories,

                selectedCategory,

                monthlyBudgetVal,

                expensesArray,

                trashArray

            },

            {

                merge:true

            }

        );

    }
    catch(error) {

        console.error(error);

    }

}


/* LOAD DATA */

async function loadUserData(uid) {

    try {

        const ref =
        doc(
            db,
            "users",
            uid
        );


        const snapshot =
        await getDoc(ref);


        if(snapshot.exists()) {

            const data =
            snapshot.data();


            categories =
            data.categories || categories;


            selectedCategory =
            data.selectedCategory || categories[0];


            monthlyBudgetVal =
            data.monthlyBudgetVal || 0;


            expensesArray =
            data.expensesArray || [];


            trashArray =
            data.trashArray || [];


            /* DELETE OLD TRASH AFTER 30 DAYS */

            const thirtyDaysAgo =
            Date.now()
            -
            30
            *
            24
            *
            60
            *
            60
            *
            1000;


            trashArray =
            trashArray.filter(
                item =>
                !item.deletedAt
                ||
                item.deletedAt
                >
                thirtyDaysAgo
            );


            await saveUserData();

        }
        else {

            await saveUserData();

        }

    }
    catch(error) {

        console.error(
            "Firestore Error:",
            error
        );

    }


    initCategories();

    renderAll();

}


/* AUTH STATE */

onAuthStateChanged(
    auth,

    async(user) => {

        const loading =
        document.getElementById(
            "loading-screen"
        );


        if(user) {

            currentUserUid =
            user.uid;


            document
            .querySelectorAll(".auth-box")
            .forEach(
                box =>
                box.classList.remove("active")
            );


            document
            .getElementById("app-box")
            .classList.add("active");


            document
            .getElementById("user-name-display")
            .innerText =
            user.displayName
            ||
            "بەکارهێنەر";


            document
            .getElementById("user-email-display")
            .innerText =
            "📧 "
            +
            user.email;


            await loadUserData(
                user.uid
            );


            loading.style.display =
            "none";

        }

        else {

            currentUserUid =
            null;


            document
            .getElementById("app-box")
            .classList.remove("active");


            document
            .getElementById("login-box")
            .classList.add("active");


            loading.style.display =
            "none";

        }

    }

);


/* ADD EXPENSE */

window.addExpense =
async function() {

    const title =
    document
    .getElementById("expense-title")
    .value
    .trim();


    const amount =
    parseFloat(

        document
        .getElementById("expense-amount")
        .value

    );


    if(
        !title
        ||
        isNaN(amount)
        ||
        amount <= 0
    ) {

        alert("زانیارییەکان بە دروستی بنووسە");

        return;

    }


    const item = {

        id: Date.now(),

        category:
        selectedCategory,

        title,

        amount,

        dateTime:
        new Date()
        .toLocaleString()

    };


    expensesArray.push(item);


    await saveUserData();


    renderAll();


    document
    .getElementById("expense-title")
    .value = "";


    document
    .getElementById("expense-amount")
    .value = "";

};


/* DELETE EXPENSE */

window.deleteExpense =
async function(id) {

    const index =
    expensesArray.findIndex(
        item =>
        item.id === id
    );


    if(index === -1) return;


    const item =
    expensesArray.splice(
        index,
        1
    )[0];


    item.deletedAt =
    Date.now();


    trashArray.push(item);


    await saveUserData();


    renderAll();

};


/* SAVE BUDGET */

window.saveBudget =
async function() {

    const amount =
    parseFloat(

        document
        .getElementById(
            "monthly-budget-input"
        )
        .value

    );


    if(
        isNaN(amount)
        ||
        amount < 0
    ) {

        alert("بڕی پارەی دروست بنووسە");

        return;

    }


    monthlyBudgetVal =
    amount;


    await saveUserData();


    renderAll();

};


/* RENDER */

function renderAll() {

    const total =
    expensesArray.reduce(

        (
            sum,
            item
        )
        =>
        sum
        +
        Number(item.amount),

        0

    );


    document
    .getElementById(
        "total-expense"
    )
    .innerText =
    total;


    document
    .getElementById(
        "display-budget"
    )
    .innerText =
    monthlyBudgetVal;


    document
    .getElementById(
        "monthly-budget-input"
    )
    .value =
    monthlyBudgetVal;


    const remaining =
    monthlyBudgetVal
    -
    total;


    const remainingElement =
    document
    .getElementById(
        "remaining-budget"
    );


    remainingElement.innerText =
    remaining;


    let html = "";


    expensesArray
    .slice()
    .reverse()
    .forEach(

        item => {

            html += `

            <li class="history-item">

                <div class="item-info">

                    <h4>
                        ${item.title}
                    </h4>

                    <span>
                        ${item.category}
                        -
                        ${item.dateTime}
                    </span>

                </div>


                <div class="item-left">

                    <div class="item-price">

                        -${item.amount}

                    </div>


                    <button
                        class="btn-danger"
                        onclick="deleteExpense(${item.id})">

                        سڕینەوە

                    </button>

                </div>

            </li>

            `;

        }

    );


    document
    .getElementById(
        "expense-list"
    )
    .innerHTML =
    html;

}


/* CATEGORIES */

function initCategories() {

    const list =
    document
    .getElementById(
        "custom-dropdown-list"
    );


    list.innerHTML =
    "";


    document
    .getElementById(
        "selected-category-text"
    )
    .innerHTML =
    selectedCategory
    +
    " ▼";


    categories.forEach(

        category => {

            const div =
            document.createElement("div");


            div.className =
            "custom-option";


            div.innerHTML =
            `
            <span>
                ${category}
            </span>

            <span
                class="option-delete">

                ×

            </span>
            `;


            div.onclick =
            async() => {

                selectedCategory =
                category;


                await saveUserData();


                initCategories();


                toggleCustomDropdown();

            };


            list.appendChild(div);

        }

    );

}


window.toggleCustomDropdown =
function() {

    document
    .getElementById(
        "custom-dropdown-list"
    )
    .classList.toggle(
        "active"
    );

};


/* ADD CATEGORY */

window.addCategory =
async function() {

    const category =
    prompt(
        "ناوی جۆری نوێ بنووسە"
    );


    if(
        !category
        ||
        categories.includes(category)
    ) return;


    categories.push(category);


    selectedCategory =
    category;


    await saveUserData();


    initCategories();

};


/* MENU */

window.toggleMenu =
function() {

    document
    .getElementById(
        "dropdown-menu"
    )
    .classList.toggle(
        "active"
    );

};


/* TABS */

window.switchTab =
function(
    name,
    event
) {

    document
    .querySelectorAll(".tab-btn")
    .forEach(
        button =>
        button.classList.remove("active")
    );


    document
    .querySelectorAll(".section")
    .forEach(
        section =>
        section.classList.remove("active")
    );


    event.target
    .classList.add(
        "active"
    );


    document
    .getElementById(
        name + "-section"
    )
    .classList.add(
        "active"
    );

};


/* DELETE ACCOUNT */

window.deleteAccount =
async function() {

    if(
        !confirm(
            "دڵنیایت دەتەوێت هەژمارەکەت بسڕیتەوە؟"
        )
    ) return;


    try {

        await deleteDoc(

            doc(
                db,
                "users",
                currentUserUid
            )

        );


        await deleteUser(
            auth.currentUser
        );


    }
    catch(error) {

        alert(
            "پێویستە سەرەتا دووبارە بچیتە ژوورەوە، پاشان سڕینەوە بکە."
        );

    }

};


/* TRASH */

window.openTrashModal =
function() {

    let html =
    "";


    trashArray.forEach(

        item => {

            html += `

            <div class="trash-row">

                <div>

                    <b>
                        ${item.title}
                    </b>

                    -
                    ${item.amount}

                </div>


                <button
                    class="btn-restore"
                    onclick="restoreExpense(${item.id})">

                    گەڕانەوە

                </button>

            </div>

            `;

        }

    );


    if(
        !html
    ) {

        html =
        "هیچ مامەڵەی سڕاوە نییە";

    }


    document
    .getElementById(
        "modal-title"
    )
    .innerText =
    "مامەڵە سڕاوەکان";


    document
    .getElementById(
        "modal-body-content"
    )
    .innerHTML =
    html;


    document
    .getElementById(
        "modal-ok-btn"
    )
    .style.display =
    "none";


    document
    .getElementById(
        "generic-modal"
    )
    .classList.add(
        "active"
    );

};


window.restoreExpense =
async function(id) {

    const index =
    trashArray.findIndex(
        item =>
        item.id === id
    );


    if(index === -1) return;


    const item =
    trashArray.splice(
        index,
        1
    )[0];


    delete item.deletedAt;


    expensesArray.push(item);


    await saveUserData();


    renderAll();


    openTrashModal();

};


/* NAME */

window.openNameModal =
function() {

    const name =
    prompt(
        "ناوی نوێ بنووسە"
    );


    if(
        !name
    ) return;


    updateProfile(
        auth.currentUser,
        {
            displayName:name
        }
    )
    .then(
        () => {

            document
            .getElementById(
                "user-name-display"
            )
            .innerText =
            name;

        }
    );

};


/* CLOSE MODAL */

window.closeModal =
function() {

    document
    .getElementById(
        "generic-modal"
    )
    .classList.remove(
        "active"
    );

};

</script>

</body>
</html>
